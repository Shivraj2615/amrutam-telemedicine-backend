openapi: 3.0.3

info:
  title: Amrutam Telemedicine API
  version: 1.0.0
  description: REST API for doctor discovery, bookings, consultations, and prescriptions.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Authentication
  - name: Doctors
  - name: Bookings
  - name: Consultations
  - name: Prescriptions

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safely retrying a booking request.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  responses:
    Unauthorized:
      description: Authentication is required or the token is invalid.
    Forbidden:
      description: The caller is not permitted to perform this action.
    NotFound:
      description: The requested resource was not found.
    Conflict:
      description: The request conflicts with the current resource state.

paths:
  /health/live:
    get:
      tags: [Health]
      summary: Check application liveness
      responses:
        "200":
          description: Application process is responding.

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "201":
          description: Patient registered.
        "400":
          description: Invalid request.
        "409":
          description: Account already exists.

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful.
        "401":
          description: Invalid credentials.

  /api/v1/doctors:
    get:
      tags: [Doctors]
      summary: Search and list doctors
      parameters:
        - name: specialization
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Matching doctors.

  /api/v1/doctors/{doctorId}/slots:
    get:
      tags: [Doctors]
      summary: List available slots for a doctor
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Available slots.
        "404":
          description: Doctor not found.

  /api/v1/bookings:
    post:
      tags: [Bookings]
      summary: Book an available consultation slot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slotId]
              properties:
                slotId:
                  type: integer
                reason:
                  type: string
      responses:
        "201":
          description: Booking created.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/consultations:
    get:
      tags: [Consultations]
      summary: List consultations visible to the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Consultation list.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/consultations/{consultationId}/status:
    patch:
      tags: [Consultations]
      summary: Update consultation status
      security:
        - bearerAuth: []
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, in_progress, completed, cancelled, no_show]
      responses:
        "200":
          description: Consultation status updated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/consultations/{consultationId}/prescriptions:
    get:
      tags: [Prescriptions]
      summary: Retrieve a consultation prescription
      security:
        - bearerAuth: []
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prescription retrieved.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Prescriptions]
      summary: Create a consultation prescription
      security:
        - bearerAuth: []
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [details]
              properties:
                details:
                  type: object
                  additionalProperties: true
                notes:
                  type: string
      responses:
        "201":
          description: Prescription created.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
